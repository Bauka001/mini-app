<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0F13" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Focus — daily brain training mini app" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://telegram.org" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <title>Focus</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body { height: 100%; overscroll-behavior-y: contain; }
      body {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
      }
      * { -webkit-user-select: none; user-select: none; }
    </style>
  </head>
  <body class="bg-black text-white overflow-hidden">
    <div id="root">
      <!-- JS-free boot fallback. Stays visible only until React replaces the
           root's children. If the bundle never executes (Telegram WebView
           serving a stale cached page, blocked CDN, broken module graph),
           the user still sees a recognisable screen with a manual reload
           button instead of an unrecoverable blank cream WebView. -->
      <div id="boot-fallback" style="
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; padding: 24px;
        background: #0F0F13; color: #FFFFFF;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        text-align: center;
      ">
        <div style="
          width: 48px; height: 48px;
          border: 3px solid rgba(255,255,255,0.15);
          border-top-color: #D97757;
          border-radius: 50%;
          animation: focus-spin 0.9s linear infinite;
        "></div>
        <div style="font-size: 16px; font-weight: 600; letter-spacing: 0.02em;">Loading Focus…</div>
        <div id="boot-fallback-hint" style="
          font-size: 13px; color: rgba(255,255,255,0.55); max-width: 280px; line-height: 1.45;
          opacity: 0; transition: opacity 250ms ease;
        ">Taking longer than usual. Tap below to reload — this clears the local cache.</div>
        <button id="boot-fallback-reload" type="button" style="
          margin-top: 4px; padding: 12px 20px;
          background: #D97757; color: #FFFFFF;
          border: 0; border-radius: 12px;
          font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
          cursor: pointer;
          opacity: 0; pointer-events: none; transition: opacity 250ms ease;
        ">Reload</button>
      </div>
    </div>
    <style>
      @keyframes focus-spin { to { transform: rotate(360deg); } }
    </style>
    <script src="/boot-fallback.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

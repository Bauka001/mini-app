        <rect x="84"  y="0" width="38" height="38" rx="8" fill="#F0EEE6" stroke="#E5E2D8"/>
        <rect x="126" y="0" width="38" height="38" rx="8" fill="#F0EEE6" stroke="#E5E2D8"/>
